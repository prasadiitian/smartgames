<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="{{tagline}}">
<meta name="theme-color" content="#0d1118">
<title>{{title}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2230'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="stylesheet" href="kit.css">
<style>:root{--accent:{{accent}}}</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" aria-hidden="true">{{initial}}</div>
    <h1>{{title}}<small>{{genre}}</small></h1>
    <div class="stat"><span>{{scoreLabel}}</span><b id="score">0</b></div>
    <div class="stat"><span>Best</span><b id="best">0</b></div>
  </header>
  <div id="stage"><canvas id="cv" aria-label="{{title}} game board"></canvas><div id="over" hidden></div></div>
  <div id="hint">{{hint}}</div>
  <div class="bar">
    <button id="btnHelp" aria-label="How to play"></button>
    <button id="btnPause"></button>
    <button id="btnMute"></button>
  </div>
  <footer>{{title}} v<span id="ver">{{version}}</span> · free · no ads · saves on this device</footer>
</div>
<div id="help" hidden role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="sheet">
    <div class="eyebrow">How to play</div>
    <h2 id="helpTitle">{{title}}</h2>
    <p class="goal">{{goal}}</p>
    <ol>{{stepsHtml}}</ol>
    <div class="tip"><b>Tip:</b> {{tip}}</div>
    <div class="go"><button class="primary" id="btnPlay">Play</button></div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
